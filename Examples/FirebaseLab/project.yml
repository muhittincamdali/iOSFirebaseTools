# XcodeGen spec for FirebaseLab.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: FirebaseLab
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
packages:
  iOSFirebaseTools:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FirebaseLab:
    type: application
    platform: iOS
    sources: [FirebaseLab]
    dependencies:
      - package: iOSFirebaseTools
        product: iOSFirebaseTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.FirebaseLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Firebase Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: FirebaseLab/Info.plist
      properties:
        # The Local Emulator Suite serves plain HTTP on the Mac running the simulator.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  FirebaseLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FirebaseLabUITests]
    dependencies:
      - target: FirebaseLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.FirebaseLab.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FirebaseLab
schemes:
  FirebaseLab:
    build:
      targets:
        FirebaseLab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FirebaseLabUITests
