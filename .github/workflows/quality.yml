# Managed by the repository kit (muhittincamdali/.github): links, wording and README translations.
name: Quality

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "26 18 * * 4"
  workflow_dispatch:

permissions: {}

jobs:
  links:
    permissions:
      contents: read
    uses: muhittincamdali/.github/.github/workflows/links.yml@59e72703c617cfab0c12482c477e706c485ed683 # v1.1.1

  hygiene:
    permissions:
      contents: read
    uses: muhittincamdali/.github/.github/workflows/hygiene.yml@59e72703c617cfab0c12482c477e706c485ed683 # v1.1.1

  translations:
    permissions:
      contents: read
    uses: muhittincamdali/.github/.github/workflows/readme-i18n-sync.yml@59e72703c617cfab0c12482c477e706c485ed683 # v1.1.1
    with:
      languages: tr zh-CN ja ko es de fr pt-BR ru
      # The translations follow README.md in a separate pass; until then a stale translation is
      # a warning. Errors (a changed language selector, a translation that claims the current
      # version but differs in code or links) still fail. Set back to true after that pass.
      strict: false
