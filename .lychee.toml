# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# 403/429 from rate limiting are not broken links; everything else outside 2xx is.
accept = ["200..=299", "403", "429"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]

# The DocC site on github.io and the README graphics on raw.githubusercontent.com exist only after
# this branch is merged and the documentation is deployed. Until then each article page is checked
# as its source file at the last commit that changed the catalog, and each graphic at the commit
# that adds it. A documentation URL that matches no rule is checked on github.io, so a misspelled
# or missing article fails. Point the catalog rules at the new commit when an article is added or
# renamed, and delete this block after the first documentation deploy so the real addresses are
# checked again.
remap = [
  '^https://muhittincamdali\.github\.io/iOSFirebaseTools/documentation/iosfirebasetools/?$ https://github.com/muhittincamdali/iOSFirebaseTools/blob/4785b572d5691ef32c0093839d2448f7f89411eb/Sources/iOSFirebaseTools/iOSFirebaseTools.docc/iOSFirebaseTools.md',
  '^https://muhittincamdali\.github\.io/iOSFirebaseTools/documentation/iosfirebasetools/gettingstarted$ https://github.com/muhittincamdali/iOSFirebaseTools/blob/4785b572d5691ef32c0093839d2448f7f89411eb/Sources/iOSFirebaseTools/iOSFirebaseTools.docc/GettingStarted.md',
  '^https://muhittincamdali\.github\.io/iOSFirebaseTools/documentation/iosfirebasetools/signingin$ https://github.com/muhittincamdali/iOSFirebaseTools/blob/4785b572d5691ef32c0093839d2448f7f89411eb/Sources/iOSFirebaseTools/iOSFirebaseTools.docc/SigningIn.md',
  '^https://muhittincamdali\.github\.io/iOSFirebaseTools/documentation/iosfirebasetools/workingwithfirestore$ https://github.com/muhittincamdali/iOSFirebaseTools/blob/4785b572d5691ef32c0093839d2448f7f89411eb/Sources/iOSFirebaseTools/iOSFirebaseTools.docc/WorkingWithFirestore.md',
  '^https://muhittincamdali\.github\.io/iOSFirebaseTools/documentation/iosfirebasetools/verifyingidtokens$ https://github.com/muhittincamdali/iOSFirebaseTools/blob/4785b572d5691ef32c0093839d2448f7f89411eb/Sources/iOSFirebaseTools/iOSFirebaseTools.docc/VerifyingIDTokens.md',
  '^https://muhittincamdali\.github\.io/iOSFirebaseTools/documentation/iosfirebasetools/testingwiththeemulators$ https://github.com/muhittincamdali/iOSFirebaseTools/blob/4785b572d5691ef32c0093839d2448f7f89411eb/Sources/iOSFirebaseTools/iOSFirebaseTools.docc/TestingWithTheEmulators.md',
  '^https://muhittincamdali\.github\.io/iOSFirebaseTools/documentation/iosfirebasetools/loggingandredaction$ https://github.com/muhittincamdali/iOSFirebaseTools/blob/4785b572d5691ef32c0093839d2448f7f89411eb/Sources/iOSFirebaseTools/iOSFirebaseTools.docc/LoggingAndRedaction.md',
  '^https://raw\.githubusercontent\.com/muhittincamdali/iOSFirebaseTools/master/(.*) https://raw.githubusercontent.com/muhittincamdali/iOSFirebaseTools/cf3ab47c9309a61ab64fc4a2772d628478ae8b60/$1',
]
